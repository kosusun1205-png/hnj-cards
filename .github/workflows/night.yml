name: 스레드 밤 글 자동 게시

on:
  schedule:
    - cron: '41 11 * * *'   # 한국 20:41 (정각 피함, 지연돼도 밤 시간대)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '테스트 모드 (실제로 올리지 않음)'
        type: boolean
        default: true

permissions:
  contents: write   # 밤 글·게시 기록 커밋

concurrency:
  group: daily-card   # 아침 게시와 동시에 커밋하지 않게
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 밤 글 게시
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python night.py publish ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: 게시 기록 커밋
        if: always()
        run: |
          git config user.name "HnJ Saju Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cards
          git commit -m "밤 글 $(TZ=Asia/Seoul date +%Y-%m-%d)" || echo "변경 없음"
          git pull --rebase -q && git push

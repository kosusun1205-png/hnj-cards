name: 띠별 운세 카드 자동 게시

on:
  schedule:
    # 한국 오전 6:30 → UTC 21:30
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '테스트 모드 (인스타에 실제로 올리지 않음)'
        type: boolean
        default: true

permissions:
  contents: write   # 카드 이미지를 이 저장소에 커밋 (인스타가 공개 주소로 가져감)

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 한글 글꼴 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 카드 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python card.py generate
      - name: 카드 이미지 커밋
        id: push
        run: |
          git config user.name "HnJ Saju Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cards
          git commit -m "카드 $(TZ=Asia/Seoul date +%Y-%m-%d)" || echo "변경 없음"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 인스타 게시 + 운영자 알림
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python card.py publish ${{ steps.push.outputs.sha }} ${{ inputs.dry_run && '--dry-run' || '' }}

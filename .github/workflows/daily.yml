name: 띠별 운세 카드 자동 게시

on:
  schedule:
    # GitHub 예약은 수 시간씩 밀림 → 새벽 2시대에 시작해 카드를 만들어 두고 06:30까지 기다렸다 게시
    - cron: '23 17 * * *'   # 한국 02:23
  workflow_dispatch:
    inputs:
      dry_run:
        description: '테스트 모드 (실제로 올리지 않음)'
        type: boolean
        default: true
      weekly:
        description: '주간 비교 게시물도 함께 (일요일이 아니어도 테스트)'
        type: boolean
        default: false

permissions:
  contents: write   # 카드 이미지·게시 기록 커밋, 릴스 영상은 media 브랜치로

concurrency:
  group: daily-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    env:
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      FORCE_WEEKLY: ${{ inputs.weekly && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 오늘 이미 게시했는지 확인
        id: check
        run: python card.py check
      - name: 한글 글꼴 + ffmpeg 설치
        if: steps.check.outputs.posted != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
      - name: 카드 + 릴스 생성
        if: steps.check.outputs.posted != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python card.py generate
      - name: 카드 이미지 커밋
        if: steps.check.outputs.posted != 'true'
        id: push
        run: |
          git config user.name "HnJ Saju Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cards
          git commit -m "카드 $(TZ=Asia/Seoul date +%Y-%m-%d)" || echo "변경 없음"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 릴스 영상 업로드 (media 브랜치, 매일 덮어씀)
        if: steps.check.outputs.posted != 'true'
        id: media
        run: |
          F="cards/$(TZ=Asia/Seoul date +%Y%m%d).mp4"
          if [ -f "$F" ]; then
            mkdir -p /tmp/media && cp "$F" /tmp/media/ && cd /tmp/media
            git init -q -b media && git add .
            git -c user.name="HnJ Saju Bot" -c user.email="actions@users.noreply.github.com" commit -qm "media"
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: 게시 시각(06:30)까지 대기
        if: steps.check.outputs.posted != 'true' && github.event_name == 'schedule'
        run: python wait_until.py 6 30
      - name: 피드 · 릴스 · 스레드 게시 + 운영자 알림
        if: steps.check.outputs.posted != 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python card.py publish ${{ steps.push.outputs.sha }} ${{ steps.media.outputs.sha }} ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: 게시 기록 커밋 (같은 날 중복 게시 방지)
        if: always() && steps.check.outputs.posted != 'true' && !inputs.dry_run
        run: |
          git add cards
          git commit -m "게시 기록 $(TZ=Asia/Seoul date +%Y-%m-%d)" || echo "변경 없음"
          git pull --rebase -q && git push
